services:
  - type: web
    name: director-os-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ATLAS_API_KEY
        sync: false   # Set this manually in the Render dashboard
    autoDeploy: true
